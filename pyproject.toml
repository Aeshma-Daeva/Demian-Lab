[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demian-lab"
version = "1.0.0"
description = "Active Demian native substrate research lab"
requires-python = ">=3.11"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
research = [
    "pydantic>=2.13.0",
    "pyarrow>=23.0.0",
    "mlflow>=3.12.0",
    "optuna>=4.8.0",
    "tensorboard>=2.20.0",
]

[tool.setuptools.packages.find]
include = ["development*"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".git",
    ".pytest_cache",
    "venv",
    "data",
    "docs/assets",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = []

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
]
