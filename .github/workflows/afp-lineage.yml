name: AFP lineage research

on:
  push:
    branches:
      - research/afp-lineage-2026-10-01
  pull_request:
    paths:
      - 'development/afp_lineage_probe.py'
      - 'development/afp_v9_causal_followup.py'
      - 'tests/test_afp_lineage_probe.py'
      - 'tests/test_afp_v9_causal_followup.py'
      - 'docs/AFP_*.md'
      - '.github/workflows/afp-lineage.yml'

jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install
        run: python -m pip install -e . pytest numpy
      - name: Focused tests
        run: |
          python -m pytest \
            tests/test_afp_lineage_probe.py \
            tests/test_afp_v9_causal_followup.py -q
      - name: Run native-v9 AFP causal follow-up
        run: |
          python -m development.afp_v9_causal_followup \
            --hidden-size 32 \
            --checkpoint-step 384 \
            --future-steps 64 \
            --stale-lags 16,32,64,96 \
            --seeds 102-129 \
            --candidate-seeds 104,112,123,126 \
            --impulse-scale 0.15 \
            --output-dir outputs/v9-afp-causal
      - name: Upload causal results
        uses: actions/upload-artifact@v4
        with:
          name: v9-afp-causal-results
          path: outputs/v9-afp-causal/
