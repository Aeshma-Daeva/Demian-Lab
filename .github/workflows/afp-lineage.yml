name: AFP lineage research

on:
  push:
    branches:
      - research/afp-lineage-2026-10-01
  pull_request:
    paths:
      - 'development/afp_lineage_probe.py'
      - 'tests/test_afp_lineage_probe.py'
      - 'docs/AFP_LINEAGE_PROTOCOL.md'
      - '.github/workflows/afp-lineage.yml'

jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install
        run: python -m pip install -e . pytest numpy
      - name: Focused smoke test
        run: python -m pytest tests/test_afp_lineage_probe.py -q
      - name: Run lineage batch
        run: |
          python -m development.afp_lineage_probe \
            --hidden-size 32 \
            --steps 384 \
            --tail-steps 96 \
            --seeds 94,95,96,97,98,99,100,101 \
            --perturb-step 192 \
            --perturb-scale 0.35 \
            --output-dir outputs/afp-lineage
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: afp-lineage-results
          path: outputs/afp-lineage/
